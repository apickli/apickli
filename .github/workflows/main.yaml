# GitHub workflow to automate apickli builds
name: apickli tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  matrix-test:
    name: test (${{ matrix.node-version }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies & run CI pipeline
        run: |
          npm install
          npm run ci

  test:
    name: test
    needs: matrix-test
    runs-on: ubuntu-latest
    steps:
      - name: Status check reporter
        run: echo "All Node.js matrix tests passed!"
